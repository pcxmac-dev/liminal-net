name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The network itself: formatting, lints and the tests, on both systems. Linux is where the Unix sockets, the key
  # file's permissions and the socket addresses are built and run.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The bridge is a member of the workspace, and its build looks for a Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - run: rustup default 1.99.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - run: cargo test -p liminal-net

  # The Python bridge: built as pip builds it, then its tests. liminal-libs is checked out beside it, as on a
  # working PC, so that the digests are compared with host.py's own.
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: net
      - uses: actions/checkout@v4
        with:
          repository: pcxmac-dev/liminal-libs
          ref: release/0.2.0
          path: common
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - run: python -m pip install pytest ./net/liminal-net-py
      - run: python -m pytest -q net/liminal-net-py/tests
